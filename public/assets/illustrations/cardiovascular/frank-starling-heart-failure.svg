<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="800" height="500" fill="#faf8f4"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1c2430">Frank-Starling Relationship &amp; Heart Failure</text>
  <text x="400" y="54" text-anchor="middle" font-size="12.5" fill="#5b6472">Ventricular performance vs. preload, and how contractility shifts the curve</text>

  <!-- axes -->
  <line x1="100" y1="430" x2="100" y2="90" stroke="#1c2430" stroke-width="2"/>
  <line x1="100" y1="430" x2="700" y2="430" stroke="#1c2430" stroke-width="2"/>
  <text x="400" y="468" text-anchor="middle" font-size="14" fill="#1c2430">Preload (LVEDV / LVEDP)</text>
  <text x="34" y="260" text-anchor="middle" font-size="14" fill="#1c2430" transform="rotate(-90 34 260)">Stroke Volume / Cardiac Output</text>

  <!-- arrowheads -->
  <path d="M100 90 l-6 12 h12 z" fill="#1c2430"/>
  <path d="M700 430 l-12 -6 v12 z" fill="#1c2430"/>

  <!-- Normal curve -->
  <path d="M105 420 C 220 280, 340 150, 620 118" fill="none" stroke="#1c2430" stroke-width="3"/>
  <text x="628" y="112" font-size="13" font-weight="600" fill="#1c2430">Normal</text>

  <!-- Increased contractility (inotropes, exercise) -->
  <path d="M105 400 C 200 220, 300 100, 560 80" fill="none" stroke="#2f7d4f" stroke-width="3"/>
  <text x="410" y="72" font-size="13" font-weight="600" fill="#2f7d4f">&#8593; Contractility (catecholamines, digoxin)</text>

  <!-- HFrEF: reduced contractility, flattened/downward-shifted -->
  <path d="M105 428 C 260 400, 420 340, 650 260" fill="none" stroke="#b5472a" stroke-width="3"/>
  <text x="500" y="300" font-size="13" font-weight="600" fill="#b5472a">HFrEF (&#8595; contractility)</text>

  <!-- HFpEF: shifted right/down (needs higher filling pressure for same SV), stiff ventricle -->
  <path d="M230 430 C 320 420, 460 360, 660 200" fill="none" stroke="#3b5f8a" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="470" y="215" font-size="13" font-weight="600" fill="#3b5f8a">HFpEF (&#8595; compliance, &#8593; filling pressure needed)</text>

  <!-- operating points -->
  <circle cx="300" cy="205" r="5" fill="#1c2430"/>
  <text x="308" y="200" font-size="11.5" fill="#1c2430">normal operating point</text>

  <!-- legend box -->
  <rect x="470" y="330" width="215" height="86" fill="#ffffff" stroke="#c9a25a" stroke-width="1.2" rx="6"/>
  <text x="482" y="348" font-size="11.5" font-weight="700" fill="#1c2430">Key points</text>
  <text x="482" y="365" font-size="10.5" fill="#5b6472">HFrEF: curve shifts down/right —</text>
  <text x="482" y="378" font-size="10.5" fill="#5b6472">less SV for a given preload</text>
  <text x="482" y="393" font-size="10.5" fill="#5b6472">HFpEF: stiff LV needs higher</text>
  <text x="482" y="406" font-size="10.5" fill="#5b6472">filling pressure for normal SV</text>
</svg>
