<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="800" height="500" fill="#faf8f4"/>
  <text x="400" y="26" text-anchor="middle" font-size="20" font-weight="700" fill="#1c2430">GI Hormone Signaling</text>
  <text x="400" y="45" text-anchor="middle" font-size="12.5" fill="#5b6472">Source cells and targets of the major gut hormones along the tube</text>

  <!-- gut tube -->
  <path d="M60 250 Q120 190 200 250 Q260 300 320 250 Q380 200 470 250 Q540 300 620 250 Q680 210 740 250"
        fill="none" stroke="#1c2430" stroke-width="10" stroke-linecap="round"/>
  <text x="70" y="215" font-size="10.5" font-weight="700" fill="#1c2430">Stomach</text>
  <text x="255" y="195" font-size="10.5" font-weight="700" fill="#1c2430">Duodenum</text>
  <text x="470" y="195" font-size="10.5" font-weight="700" fill="#1c2430">Jejunum/Ileum</text>
  <text x="670" y="200" font-size="10.5" font-weight="700" fill="#1c2430">Ileum</text>

  <defs>
    <marker id="arr-gi" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#5b6472"/>
    </marker>
  </defs>

  <!-- Gastrin -->
  <circle cx="110" cy="245" r="7" fill="#b5472a"/>
  <line x1="110" y1="238" x2="110" y2="100" stroke="#b5472a" stroke-width="1.5" marker-end="url(#arr-gi)"/>
  <rect x="35" y="60" width="150" height="42" rx="6" fill="#b5472a"/>
  <text x="110" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#faf8f4">Gastrin</text>
  <text x="110" y="92" text-anchor="middle" font-size="8.5" fill="#faf8f4">G cells, antrum</text>
  <text x="35" y="115" font-size="8.5" fill="#5b6472">&#8594; &#8593; gastric H&#8314; (parietal cells)</text>
  <text x="35" y="127" font-size="8.5" fill="#5b6472">&#8594; &#8593; LES tone, gastric motility</text>
  <text x="35" y="139" font-size="8.5" fill="#5b6472">trigger: stomach distension, peptides, vagal</text>

  <!-- Somatostatin -->
  <circle cx="160" cy="245" r="7" fill="#3b5f8a"/>
  <line x1="160" y1="238" x2="230" y2="155" stroke="#3b5f8a" stroke-width="1.5" marker-end="url(#arr-gi)"/>
  <rect x="200" y="60" width="160" height="42" rx="6" fill="#3b5f8a"/>
  <text x="280" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#faf8f4">Somatostatin</text>
  <text x="280" y="92" text-anchor="middle" font-size="8.5" fill="#faf8f4">D cells, antrum/duodenum</text>
  <text x="200" y="115" font-size="8.5" fill="#5b6472">&#8594; &#8595; all GI hormone secretion</text>
  <text x="200" y="127" font-size="8.5" fill="#5b6472">&#8594; &#8595; gastric acid, motility</text>

  <!-- CCK -->
  <circle cx="280" cy="270" r="7" fill="#2f7d4f"/>
  <line x1="280" y1="277" x2="280" y2="330" stroke="#2f7d4f" stroke-width="1.5" marker-end="url(#arr-gi)"/>
  <rect x="200" y="330" width="180" height="66" rx="6" fill="#2f7d4f"/>
  <text x="290" y="349" text-anchor="middle" font-size="11" font-weight="700" fill="#faf8f4">CCK</text>
  <text x="290" y="363" text-anchor="middle" font-size="8.5" fill="#faf8f4">I cells, duodenum/jejunum</text>
  <text x="290" y="378" text-anchor="middle" font-size="8" fill="#faf8f4">&#8594; &#8593; pancreatic enzyme &amp; bile</text>
  <text x="290" y="390" text-anchor="middle" font-size="8" fill="#faf8f4">secretion, gallbladder contraction,</text>
  <text x="215" y="415" font-size="8.5" fill="#5b6472">trigger: fatty acids, amino acids;</text>
  <text x="215" y="427" font-size="8.5" fill="#5b6472">also &#8595;gastric emptying, &#8593;satiety</text>

  <!-- Secretin -->
  <circle cx="320" cy="270" r="7" fill="#c9a25a"/>
  <line x1="320" y1="277" x2="470" y2="335" stroke="#c9a25a" stroke-width="1.5" marker-end="url(#arr-gi)"/>
  <rect x="470" y="330" width="190" height="66" rx="6" fill="#c9a25a"/>
  <text x="565" y="349" text-anchor="middle" font-size="11" font-weight="700" fill="#1c2430">Secretin</text>
  <text x="565" y="363" text-anchor="middle" font-size="8.5" fill="#1c2430">S cells, duodenum</text>
  <text x="565" y="378" text-anchor="middle" font-size="8" fill="#1c2430">&#8594; &#8593; pancreatic HCO&#8323;&#8315; secretion</text>
  <text x="565" y="390" text-anchor="middle" font-size="8" fill="#1c2430">&#8594; &#8595; gastric acid secretion</text>
  <text x="490" y="415" font-size="8.5" fill="#5b6472">trigger: acid (pH&lt;4.5) in duodenum</text>

  <!-- GIP -->
  <circle cx="470" cy="255" r="7" fill="#946a2b"/>
  <line x1="470" y1="248" x2="550" y2="150" stroke="#946a2b" stroke-width="1.5" marker-end="url(#arr-gi)"/>
  <rect x="460" y="60" width="180" height="56" rx="6" fill="#946a2b"/>
  <text x="550" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#faf8f4">GIP</text>
  <text x="550" y="92" text-anchor="middle" font-size="8.5" fill="#faf8f4">K cells, duodenum/jejunum</text>
  <text x="550" y="105" text-anchor="middle" font-size="8" fill="#faf8f4">&#8594; &#8593; insulin release (oral &gt; IV glucose)</text>
  <text x="465" y="128" font-size="8.5" fill="#5b6472">&#8594; mild &#8595; gastric acid secretion</text>

  <!-- Motilin -->
  <circle cx="580" cy="260" r="7" fill="#b5472a"/>
  <line x1="580" y1="253" x2="660" y2="150" stroke="#b5472a" stroke-width="1.5" marker-end="url(#arr-gi)"/>
  <rect x="650" y="60" width="130" height="56" rx="6" fill="#b5472a"/>
  <text x="715" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#faf8f4">Motilin</text>
  <text x="715" y="92" text-anchor="middle" font-size="8.5" fill="#faf8f4">M cells, duodenum</text>
  <text x="715" y="105" text-anchor="middle" font-size="8" fill="#faf8f4">&#8594; migrating motor complex</text>

  <!-- VIP -->
  <circle cx="680" cy="250" r="7" fill="#3b5f8a"/>
  <line x1="680" y1="257" x2="700" y2="415" stroke="#3b5f8a" stroke-width="1.5" marker-end="url(#arr-gi)"/>
  <rect x="640" y="415" width="150" height="56" rx="6" fill="#3b5f8a"/>
  <text x="715" y="433" text-anchor="middle" font-size="11" font-weight="700" fill="#faf8f4">VIP</text>
  <text x="715" y="447" text-anchor="middle" font-size="8.5" fill="#faf8f4">enteric neurons</text>
  <text x="715" y="460" text-anchor="middle" font-size="8" fill="#faf8f4">&#8594; smooth muscle relax, &#8593;secretion</text>
</svg>
