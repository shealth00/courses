<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="800" height="500" fill="#faf8f4"/>
  <text x="400" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#1c2430">Seizure Classification</text>
  <text x="400" y="47" text-anchor="middle" font-size="12.5" fill="#5b6472">ILAE framework: onset, awareness, and subtype</text>

  <defs>
    <marker id="arr-sz" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#5b6472"/>
    </marker>
  </defs>

  <!-- root -->
  <rect x="330" y="60" width="140" height="40" rx="8" fill="#1c2430"/>
  <text x="400" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#faf8f4">Seizure onset</text>

  <!-- two main branches -->
  <line x1="400" y1="100" x2="180" y2="140" stroke="#5b6472" stroke-width="2" marker-end="url(#arr-sz)"/>
  <line x1="400" y1="100" x2="620" y2="140" stroke="#5b6472" stroke-width="2" marker-end="url(#arr-sz)"/>

  <rect x="100" y="140" width="160" height="40" rx="8" fill="#3b5f8a"/>
  <text x="180" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#faf8f4">Focal (partial)</text>

  <rect x="540" y="140" width="160" height="40" rx="8" fill="#b5472a"/>
  <text x="620" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#faf8f4">Generalized</text>

  <!-- unknown onset -->
  <rect x="330" y="140" width="140" height="40" rx="8" fill="#c9a25a"/>
  <text x="400" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#1c2430">Unknown onset</text>
  <line x1="400" y1="100" x2="400" y2="140" stroke="#5b6472" stroke-width="2" marker-end="url(#arr-sz)"/>

  <!-- Focal subtypes -->
  <line x1="145" y1="180" x2="100" y2="215" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arr-sz)"/>
  <line x1="180" y1="180" x2="180" y2="215" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arr-sz)"/>
  <line x1="215" y1="180" x2="260" y2="215" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arr-sz)"/>

  <rect x="30" y="215" width="140" height="52" rx="6" fill="#ffffff" stroke="#3b5f8a" stroke-width="1.5"/>
  <text x="100" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#3b5f8a">Focal aware</text>
  <text x="100" y="248" text-anchor="middle" font-size="9" fill="#5b6472">(simple partial)</text>
  <text x="100" y="260" text-anchor="middle" font-size="9" fill="#5b6472">consciousness intact</text>

  <rect x="110" y="215" width="140" height="52" rx="6" fill="#ffffff" stroke="#3b5f8a" stroke-width="1.5"/>
  <text x="180" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#3b5f8a">Focal impaired awareness</text>
  <text x="180" y="248" text-anchor="middle" font-size="9" fill="#5b6472">(complex partial)</text>
  <text x="180" y="260" text-anchor="middle" font-size="9" fill="#5b6472">automatisms, LOA</text>

  <rect x="200" y="215" width="150" height="52" rx="6" fill="#ffffff" stroke="#3b5f8a" stroke-width="1.5"/>
  <text x="275" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#3b5f8a">Focal &#8594; bilateral</text>
  <text x="275" y="248" text-anchor="middle" font-size="9" fill="#5b6472">tonic-clonic</text>
  <text x="275" y="260" text-anchor="middle" font-size="9" fill="#5b6472">(2&#176; generalization)</text>

  <!-- Generalized subtypes -->
  <line x1="580" y1="180" x2="480" y2="215" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arr-sz)"/>
  <line x1="605" y1="180" x2="590" y2="215" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arr-sz)"/>
  <line x1="635" y1="180" x2="690" y2="215" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arr-sz)"/>
  <line x1="660" y1="180" x2="770" y2="215" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arr-sz)"/>

  <rect x="410" y="215" width="130" height="60" rx="6" fill="#ffffff" stroke="#b5472a" stroke-width="1.5"/>
  <text x="475" y="233" text-anchor="middle" font-size="11" font-weight="700" fill="#b5472a">Absence</text>
  <text x="475" y="247" text-anchor="middle" font-size="9" fill="#5b6472">(petit mal)</text>
  <text x="475" y="259" text-anchor="middle" font-size="9" fill="#5b6472">staring, 3Hz spike-</text>
  <text x="475" y="270" text-anchor="middle" font-size="9" fill="#5b6472">wave, no post-ictal</text>

  <rect x="550" y="215" width="130" height="60" rx="6" fill="#ffffff" stroke="#b5472a" stroke-width="1.5"/>
  <text x="615" y="233" text-anchor="middle" font-size="11" font-weight="700" fill="#b5472a">Tonic-clonic</text>
  <text x="615" y="247" text-anchor="middle" font-size="9" fill="#5b6472">(grand mal)</text>
  <text x="615" y="259" text-anchor="middle" font-size="9" fill="#5b6472">stiffen &#8594; rhythmic</text>
  <text x="615" y="270" text-anchor="middle" font-size="9" fill="#5b6472">jerking, post-ictal</text>

  <rect x="690" y="215" width="95" height="60" rx="6" fill="#ffffff" stroke="#b5472a" stroke-width="1.5"/>
  <text x="737" y="233" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b5472a">Myoclonic</text>
  <text x="737" y="247" text-anchor="middle" font-size="8.5" fill="#5b6472">brief jerks</text>

  <rect x="405" y="290" width="130" height="52" rx="6" fill="#ffffff" stroke="#b5472a" stroke-width="1.5"/>
  <text x="470" y="308" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b5472a">Atonic</text>
  <text x="470" y="322" text-anchor="middle" font-size="8.5" fill="#5b6472">"drop attacks"</text>
  <line x1="475" y1="275" x2="470" y2="290" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arr-sz)"/>

  <rect x="550" y="290" width="130" height="52" rx="6" fill="#ffffff" stroke="#b5472a" stroke-width="1.5"/>
  <text x="615" y="308" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b5472a">Tonic / Clonic</text>
  <text x="615" y="322" text-anchor="middle" font-size="8.5" fill="#5b6472">isolated phases</text>
  <line x1="615" y1="275" x2="615" y2="290" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arr-sz)"/>

  <!-- classic clinical pearls box -->
  <rect x="30" y="330" width="720" height="140" fill="#ffffff" stroke="#c9a25a" stroke-width="1.3" rx="8"/>
  <text x="46" y="352" font-size="12.5" font-weight="700" fill="#1c2430">Clinical pearls</text>
  <text x="46" y="373" font-size="10.5" fill="#5b6472">&#8226; Focal seizures arise from one hemisphere/network; awareness is the key subdivision (replaces "simple/complex partial").</text>
  <text x="46" y="392" font-size="10.5" fill="#5b6472">&#8226; Generalized seizures involve bilateral networks from onset &#8212; no aura, often loss of consciousness.</text>
  <text x="46" y="411" font-size="10.5" fill="#5b6472">&#8226; Absence seizures: brief staring spells in children, EEG shows 3 Hz generalized spike-and-wave; first-line = ethosuximide.</text>
  <text x="46" y="430" font-size="10.5" fill="#5b6472">&#8226; Todd's paralysis (post-ictal focal weakness) points to a focal seizure origin, not generalized.</text>
  <text x="46" y="449" font-size="10.5" fill="#5b6472">&#8226; Status epilepticus = &gt;5 min continuous seizure or recurrent without recovery &#8212; medical emergency (benzodiazepine first-line).</text>
</svg>
