<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="800" height="500" fill="#faf8f4"/>
  <text x="400" y="26" text-anchor="middle" font-size="20" font-weight="700" fill="#1c2430">Basal Ganglia Circuitry</text>
  <text x="400" y="45" text-anchor="middle" font-size="12.5" fill="#5b6472">Direct (movement-facilitating) vs. indirect (movement-inhibiting) pathways</text>

  <defs>
    <marker id="arr-exc" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2f7d4f"/>
    </marker>
    <marker id="arr-inh" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b5472a"/>
    </marker>
  </defs>

  <!-- Cortex -->
  <rect x="320" y="55" width="160" height="40" rx="8" fill="#1c2430"/>
  <text x="400" y="79" text-anchor="middle" font-size="13" font-weight="700" fill="#faf8f4">Cerebral cortex</text>

  <!-- Striatum -->
  <rect x="320" y="130" width="160" height="40" rx="8" fill="#3b5f8a"/>
  <text x="400" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#faf8f4">Striatum (caudate/putamen)</text>
  <line x1="400" y1="95" x2="400" y2="130" stroke="#2f7d4f" stroke-width="2.5" marker-end="url(#arr-exc)"/>
  <text x="410" y="115" font-size="9" fill="#2f7d4f">glutamate (+)</text>

  <!-- Direct pathway column (left) -->
  <text x="185" y="195" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f7d4f">DIRECT pathway (D1)</text>
  <rect x="115" y="210" width="140" height="42" rx="8" fill="#2f7d4f"/>
  <text x="185" y="230" text-anchor="middle" font-size="11.5" font-weight="700" fill="#faf8f4">GPi / SNr</text>
  <text x="185" y="244" text-anchor="middle" font-size="9" fill="#faf8f4">(output nuclei)</text>
  <line x1="330" y1="150" x2="255" y2="222" stroke="#b5472a" stroke-width="2.5" marker-end="url(#arr-inh)"/>
  <text x="255" y="185" font-size="9" fill="#b5472a">GABA (D1, &#8722;)</text>

  <rect x="115" y="290" width="140" height="42" rx="8" fill="#c9a25a"/>
  <text x="185" y="310" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2430">Thalamus (VA/VL)</text>
  <line x1="185" y1="252" x2="185" y2="290" stroke="#b5472a" stroke-width="2.5" marker-end="url(#arr-inh)"/>
  <text x="192" y="274" font-size="9" fill="#b5472a">GABA (&#8722;)</text>

  <line x1="185" y1="332" x2="330" y2="380" stroke="#2f7d4f" stroke-width="2.5" marker-end="url(#arr-exc)"/>
  <text x="200" y="365" font-size="9" fill="#2f7d4f">glutamate (+)</text>

  <!-- Indirect pathway column (right) -->
  <text x="615" y="195" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b5472a">INDIRECT pathway (D2)</text>
  <rect x="545" y="210" width="140" height="42" rx="8" fill="#3b5f8a"/>
  <text x="615" y="230" text-anchor="middle" font-size="11.5" font-weight="700" fill="#faf8f4">GPe</text>
  <text x="615" y="244" text-anchor="middle" font-size="9" fill="#faf8f4">(external globus pallidus)</text>
  <line x1="470" y1="150" x2="560" y2="222" stroke="#b5472a" stroke-width="2.5" marker-end="url(#arr-inh)"/>
  <text x="500" y="185" font-size="9" fill="#b5472a">GABA (D2, &#8722;)</text>

  <rect x="545" y="290" width="140" height="42" rx="8" fill="#c9a25a"/>
  <text x="615" y="310" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2430">Subthalamic nucleus</text>
  <line x1="615" y1="252" x2="615" y2="290" stroke="#b5472a" stroke-width="2.5" marker-end="url(#arr-inh)"/>
  <text x="622" y="274" font-size="9" fill="#b5472a">GABA (&#8722;)</text>

  <line x1="615" y1="332" x2="255" y2="222" stroke="#2f7d4f" stroke-width="2.5" marker-end="url(#arr-exc)"/>
  <text x="460" y="290" font-size="9" fill="#2f7d4f">glutamate (+) to GPi/SNr</text>

  <!-- Thalamus feedback to cortex -->
  <line x1="255" y1="300" x2="320" y2="80" stroke="#2f7d4f" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr-exc)"/>
  <text x="245" y="150" font-size="9" fill="#2f7d4f" transform="rotate(-72 245 150)">thalamocortical (+)</text>

  <!-- Net effect summary -->
  <rect x="30" y="365" width="740" height="115" fill="#ffffff" stroke="#c9a25a" stroke-width="1.3" rx="8"/>
  <text x="46" y="387" font-size="12.5" font-weight="700" fill="#1c2430">Net effect</text>
  <text x="46" y="408" font-size="10.5" fill="#2f7d4f">Direct pathway: cortex &#8594; striatum(D1) &#8722; GPi/SNr &#8722; thalamus &#8594; less inhibition of thalamus &#8594; &#8593; thalamocortical excitation &#8594; FACILITATES movement</text>
  <text x="46" y="428" font-size="10.5" fill="#b5472a">Indirect pathway: cortex &#8594; striatum(D2) &#8722; GPe &#8722; STN &#8722; GPi/SNr(+) &#8594; &#8593; inhibition of thalamus &#8594; &#8595; thalamocortical excitation &#8594; INHIBITS movement</text>
  <text x="46" y="450" font-size="10.5" fill="#5b6472">Parkinson's: dopamine loss &#8594; &#8595;direct / &#8593;indirect &#8594; bradykinesia. Huntington's: early loss of indirect-pathway striatal neurons &#8594; chorea.</text>
  <text x="46" y="469" font-size="10.5" fill="#5b6472">Dopamine from SNc excites D1 (direct, via D1) and inhibits D2 (indirect) striatal neurons &#8212; both actions favor movement.</text>
</svg>
