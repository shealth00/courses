<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="800" height="460" fill="#faf8f4"/>
  <text x="400" y="22" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2430">Gram-Positive vs. Gram-Negative Pathogen Classification</text>
  <text x="400" y="38" text-anchor="middle" font-size="10.5" fill="#5b6472">Gram stain result branches to cocci/rods, then to organisms and their distinguishing test</text>
  <rect x="250" y="50" width="300" height="40" rx="9" fill="#1c2430"/>
  <text x="400" y="75.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff" letter-spacing="0.5">BACTERIAL CLASSIFICATION (Gram Stain)</text>
  <line x1="400" y1="90" x2="200" y2="108" stroke="#3b5f8a" stroke-width="2.4"/>
  <line x1="400" y1="90" x2="600" y2="108" stroke="#b5472a" stroke-width="2.4"/>
  <rect x="110" y="108" width="180" height="34" rx="8" fill="#3b5f8a"/>
  <text x="200" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">GRAM-POSITIVE</text>
  <rect x="510" y="108" width="180" height="34" rx="8" fill="#b5472a"/>
  <text x="600" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">GRAM-NEGATIVE</text>
  <line x1="200" y1="142" x2="110" y2="180" stroke="#3b5f8a" stroke-width="1.8"/>
  <rect x="25" y="180" width="170" height="34" rx="7" fill="#3b5f8a"/>
  <text x="110" y="202" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Cocci</text>
  <line x1="110" y1="214" x2="110" y2="428" stroke="#3b5f8a" stroke-width="1.3"/>
  <rect x="25" y="226" width="170" height="34" rx="5" fill="#faf8f4" stroke="#3b5f8a" stroke-width="1.4"/>
  <text x="110" y="240" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1c2430">S. aureus</text>
  <text x="110" y="252" text-anchor="middle" font-size="7.7" fill="#5b6472">catalase+, coagulase+</text>
  <rect x="25" y="268" width="170" height="34" rx="5" fill="#faf8f4" stroke="#3b5f8a" stroke-width="1.4"/>
  <text x="110" y="282" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1c2430">S. epidermidis</text>
  <text x="110" y="294" text-anchor="middle" font-size="7.7" fill="#5b6472">catalase+, coagulase-</text>
  <rect x="25" y="310" width="170" height="34" rx="5" fill="#faf8f4" stroke="#3b5f8a" stroke-width="1.4"/>
  <text x="110" y="324" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1c2430">S. pyogenes (GAS)</text>
  <text x="110" y="336" text-anchor="middle" font-size="7.7" fill="#5b6472">catalase-, β-hemolytic</text>
  <rect x="25" y="352" width="170" height="34" rx="5" fill="#faf8f4" stroke="#3b5f8a" stroke-width="1.4"/>
  <text x="110" y="366" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1c2430">S. pneumoniae</text>
  <text x="110" y="378" text-anchor="middle" font-size="7.7" fill="#5b6472">catalase-, α-hemolytic</text>
  <rect x="25" y="394" width="170" height="34" rx="5" fill="#faf8f4" stroke="#3b5f8a" stroke-width="1.4"/>
  <text x="110" y="408" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1c2430">Enterococcus</text>
  <text x="110" y="420" text-anchor="middle" font-size="7.7" fill="#5b6472">catalase-, γ-hemolytic</text>
  <line x1="200" y1="142" x2="290" y2="180" stroke="#3b5f8a" stroke-width="1.8"/>
  <rect x="205" y="180" width="170" height="34" rx="7" fill="#3b5f8a"/>
  <text x="290" y="202" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Rods / Bacilli</text>
  <line x1="290" y1="214" x2="290" y2="386" stroke="#3b5f8a" stroke-width="1.3"/>
  <rect x="205" y="226" width="170" height="34" rx="5" fill="#faf8f4" stroke="#3b5f8a" stroke-width="1.4"/>
  <text x="290" y="240" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1c2430">Bacillus anthracis</text>
  <text x="290" y="252" text-anchor="middle" font-size="7.7" fill="#5b6472">spore-forming, aerobic</text>
  <rect x="205" y="268" width="170" height="34" rx="5" fill="#faf8f4" stroke="#3b5f8a" stroke-width="1.4"/>
  <text x="290" y="282" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1c2430">Clostridium spp.</text>
  <text x="290" y="294" text-anchor="middle" font-size="7.7" fill="#5b6472">spore-forming, anaerobic</text>
  <rect x="205" y="310" width="170" height="34" rx="5" fill="#faf8f4" stroke="#3b5f8a" stroke-width="1.4"/>
  <text x="290" y="324" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1c2430">Listeria monocytogenes</text>
  <text x="290" y="336" text-anchor="middle" font-size="7.7" fill="#5b6472">motile, cold-tolerant</text>
  <rect x="205" y="352" width="170" height="34" rx="5" fill="#faf8f4" stroke="#3b5f8a" stroke-width="1.4"/>
  <text x="290" y="366" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1c2430">Corynebacterium diphtheriae</text>
  <text x="290" y="378" text-anchor="middle" font-size="7.7" fill="#5b6472">club-shaped, metachromatic granules</text>
  <line x1="600" y1="142" x2="510" y2="180" stroke="#b5472a" stroke-width="1.8"/>
  <rect x="425" y="180" width="170" height="34" rx="7" fill="#b5472a"/>
  <text x="510" y="202" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Cocci</text>
  <line x1="510" y1="214" x2="510" y2="344" stroke="#b5472a" stroke-width="1.3"/>
  <rect x="425" y="226" width="170" height="34" rx="5" fill="#faf8f4" stroke="#b5472a" stroke-width="1.4"/>
  <text x="510" y="240" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1c2430">N. meningitidis</text>
  <text x="510" y="252" text-anchor="middle" font-size="7.7" fill="#5b6472">oxidase+, ferments maltose</text>
  <rect x="425" y="268" width="170" height="34" rx="5" fill="#faf8f4" stroke="#b5472a" stroke-width="1.4"/>
  <text x="510" y="282" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1c2430">N. gonorrhoeae</text>
  <text x="510" y="294" text-anchor="middle" font-size="7.7" fill="#5b6472">oxidase+, no maltose fermentation</text>
  <rect x="425" y="310" width="170" height="34" rx="5" fill="#faf8f4" stroke="#b5472a" stroke-width="1.4"/>
  <text x="510" y="324" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1c2430">Moraxella catarrhalis</text>
  <text x="510" y="336" text-anchor="middle" font-size="7.7" fill="#5b6472">oxidase+, otitis / COPD flares</text>
  <line x1="600" y1="142" x2="690" y2="180" stroke="#b5472a" stroke-width="1.8"/>
  <rect x="605" y="180" width="170" height="34" rx="7" fill="#b5472a"/>
  <text x="690" y="202" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Rods / Bacilli</text>
  <line x1="690" y1="214" x2="690" y2="386" stroke="#b5472a" stroke-width="1.3"/>
  <rect x="605" y="226" width="170" height="34" rx="5" fill="#faf8f4" stroke="#b5472a" stroke-width="1.4"/>
  <text x="690" y="240" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1c2430">E. coli</text>
  <text x="690" y="252" text-anchor="middle" font-size="7.7" fill="#5b6472">lactose-fermenter, oxidase-</text>
  <rect x="605" y="268" width="170" height="34" rx="5" fill="#faf8f4" stroke="#b5472a" stroke-width="1.4"/>
  <text x="690" y="282" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1c2430">Klebsiella pneumoniae</text>
  <text x="690" y="294" text-anchor="middle" font-size="7.7" fill="#5b6472">lactose-fermenter, mucoid</text>
  <rect x="605" y="310" width="170" height="34" rx="5" fill="#faf8f4" stroke="#b5472a" stroke-width="1.4"/>
  <text x="690" y="324" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1c2430">Salmonella / Shigella</text>
  <text x="690" y="336" text-anchor="middle" font-size="7.7" fill="#5b6472">non-fermenter, oxidase-</text>
  <rect x="605" y="352" width="170" height="34" rx="5" fill="#faf8f4" stroke="#b5472a" stroke-width="1.4"/>
  <text x="690" y="366" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1c2430">Pseudomonas aeruginosa</text>
  <text x="690" y="378" text-anchor="middle" font-size="7.7" fill="#5b6472">non-fermenter, oxidase+, pigmented</text>
</svg>
