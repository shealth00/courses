  <rect x="17" y="282" width="156" height="38" rx="6" fill="#faf8f4" stroke="#3b5f8a" stroke-width="1.5"/>
  <text x="95" y="297" text-anchor="middle" font-size="10.3" font-weight="700" fill="#1c2430">Listeria</text>
  <text x="95" y="310" text-anchor="middle" font-size="8.1" fill="#5b6472">age &gt;50 / EtOH / preg.</text>
  <rect x="17" y="328" width="156" height="38" rx="6" fill="#faf8f4" stroke="#3b5f8a" stroke-width="1.5"/>
