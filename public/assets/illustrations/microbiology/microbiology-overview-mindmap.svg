  <rect x="506" y="374" width="156" height="38" rx="6" fill="#faf8f4" stroke="#5a7a3c" stroke-width="1.5"/>
  <text x="584" y="389" text-anchor="middle" font-size="10.3" font-weight="700" fill="#1c2430">C. difficile</text>
  <text x="584" y="402" text-anchor="middle" font-size="8.1" fill="#5b6472">post-antibiotic colitis</text>
