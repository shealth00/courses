  <text x="584" y="218" text-anchor="middle" font-size="8.1" fill="#5b6472">watery → bloody, → HUS</text>
  <rect x="506" y="236" width="156" height="38" rx="6" fill="#faf8f4" stroke="#5a7a3c" stroke-width="1.5"/>
