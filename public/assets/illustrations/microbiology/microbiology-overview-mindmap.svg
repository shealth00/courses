  <text x="95" y="389" text-anchor="middle" font-size="10.3" font-weight="700" fill="#1c2430">Cryptococcus</text>
  <text x="95" y="402" text-anchor="middle" font-size="8.1" fill="#5b6472">AIDS, high opening pressure</text>
  <line x1="500" y1="104" x2="258" y2="132" stroke="#b5472a" stroke-width="2.2"/>
  <rect x="180" y="132" width="156" height="40" rx="8" fill="#b5472a"/>
  <text x="258" y="149" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">Pulmonary</text>
  <text x="258" y="162" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">Infections</text>
  <line x1="258" y1="172" x2="258" y2="412" stroke="#b5472a" stroke-width="1.4"/>
  <rect x="180" y="190" width="156" height="38" rx="6" fill="#faf8f4" stroke="#b5472a" stroke-width="1.5"/>
  <text x="258" y="205" text-anchor="middle" font-size="10.3" font-weight="700" fill="#1c2430">S. pneumoniae</text>
  <text x="258" y="218" text-anchor="middle" font-size="8.1" fill="#5b6472">lobar CAP</text>
  <rect x="180" y="236" width="156" height="38" rx="6" fill="#faf8f4" stroke="#b5472a" stroke-width="1.5"/>
  <text x="258" y="251" text-anchor="middle" font-size="10.3" font-weight="700" fill="#1c2430">Mycoplasma</text>
  <text x="258" y="264" text-anchor="middle" font-size="8.1" fill="#5b6472">atypical, young adult</text>
  <rect x="180" y="282" width="156" height="38" rx="6" fill="#faf8f4" stroke="#b5472a" stroke-width="1.5"/>
  <text x="258" y="297" text-anchor="middle" font-size="10.3" font-weight="700" fill="#1c2430">Legionella</text>
