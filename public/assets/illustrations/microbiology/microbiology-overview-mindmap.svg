  <text x="500" y="39" text-anchor="middle" font-size="11" fill="#5b6472">Central concept branches into major clinical presentations, each branching to its classic pathogens</text>
  <rect x="370" y="54" width="260" height="50" rx="12" fill="#1c2430"/>
  <text x="500" y="86" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1">MICROBIOLOGY</text>
