  <rect x="343" y="328" width="156" height="38" rx="6" fill="#faf8f4" stroke="#2a7a72" stroke-width="1.5"/>
  <text x="421" y="343" text-anchor="middle" font-size="10.3" font-weight="700" fill="#1c2430">Candida</text>
  <text x="421" y="356" text-anchor="middle" font-size="8.1" fill="#5b6472">prosthetic valve</text>
  <line x1="500" y1="104" x2="584" y2="132" stroke="#5a7a3c" stroke-width="2.2"/>
  <rect x="506" y="132" width="156" height="40" rx="8" fill="#5a7a3c"/>
  <text x="584" y="149" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">GI /</text>
  <text x="584" y="162" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">Diarrheal Illness</text>
  <line x1="584" y1="172" x2="584" y2="412" stroke="#5a7a3c" stroke-width="1.4"/>
  <rect x="506" y="190" width="156" height="38" rx="6" fill="#faf8f4" stroke="#5a7a3c" stroke-width="1.5"/>
