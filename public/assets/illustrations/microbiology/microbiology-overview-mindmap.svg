  <rect x="180" y="328" width="156" height="38" rx="6" fill="#faf8f4" stroke="#b5472a" stroke-width="1.5"/>
  <text x="258" y="343" text-anchor="middle" font-size="10.3" font-weight="700" fill="#1c2430">M. tuberculosis</text>
  <text x="258" y="356" text-anchor="middle" font-size="8.1" fill="#5b6472">cavitary, weight loss</text>
  <rect x="180" y="374" width="156" height="38" rx="6" fill="#faf8f4" stroke="#b5472a" stroke-width="1.5"/>
  <text x="258" y="389" text-anchor="middle" font-size="10.3" font-weight="700" fill="#1c2430">P. jirovecii (PJP)</text>
  <text x="258" y="402" text-anchor="middle" font-size="8.1" fill="#5b6472">AIDS, CD4 &lt;200</text>
  <line x1="500" y1="104" x2="421" y2="132" stroke="#2a7a72" stroke-width="2.2"/>
  <rect x="343" y="132" width="156" height="40" rx="8" fill="#2a7a72"/>
  <text x="421" y="149" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">Bloodstream /</text>
  <text x="421" y="162" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">Endocarditis</text>
