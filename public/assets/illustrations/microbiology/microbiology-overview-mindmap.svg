  <text x="747" y="218" text-anchor="middle" font-size="8.1" fill="#5b6472">uncomplicated cystitis</text>
  <rect x="669" y="236" width="156" height="38" rx="6" fill="#faf8f4" stroke="#7a4a8a" stroke-width="1.5"/>
  <text x="747" y="251" text-anchor="middle" font-size="10.3" font-weight="700" fill="#1c2430">N. gonorrhoeae</text>
  <text x="747" y="264" text-anchor="middle" font-size="8.1" fill="#5b6472">urethritis / cervicitis</text>
  <rect x="669" y="282" width="156" height="38" rx="6" fill="#faf8f4" stroke="#7a4a8a" stroke-width="1.5"/>
  <text x="747" y="297" text-anchor="middle" font-size="10.3" font-weight="700" fill="#1c2430">C. trachomatis</text>
  <text x="747" y="310" text-anchor="middle" font-size="8.1" fill="#5b6472">urethritis, often co-infxn</text>
  <rect x="669" y="328" width="156" height="38" rx="6" fill="#faf8f4" stroke="#7a4a8a" stroke-width="1.5"/>
  <text x="747" y="343" text-anchor="middle" font-size="10.3" font-weight="700" fill="#1c2430">Trichomonas</text>
  <text x="747" y="356" text-anchor="middle" font-size="8.1" fill="#5b6472">vaginitis, motile trichomonads</text>
