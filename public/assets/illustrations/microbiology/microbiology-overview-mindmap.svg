  <rect x="832" y="190" width="156" height="38" rx="6" fill="#faf8f4" stroke="#946a2b" stroke-width="1.5"/>
  <text x="910" y="205" text-anchor="middle" font-size="10.3" font-weight="700" fill="#1c2430">S. pyogenes</text>
