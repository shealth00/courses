<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="800" height="500" fill="#faf8f4"/>
  <text x="400" y="22" text-anchor="middle" font-size="18" font-weight="700" fill="#1c2430">Brachial Plexus</text>
  <text x="400" y="39" text-anchor="middle" font-size="11.5" fill="#5b6472">Roots &#8594; Trunks &#8594; Divisions &#8594; Cords &#8594; Branches (Erb's &amp; Klumpke's sites marked)</text>

  <!-- column labels -->
  <g font-size="10.5" font-weight="700" fill="#5b6472" text-anchor="middle">
    <text x="60" y="60">Roots</text>
    <text x="185" y="60">Trunks</text>
    <text x="310" y="60">Divisions</text>
    <text x="430" y="60">Cords</text>
    <text x="600" y="60">Terminal branches</text>
  </g>

  <!-- Roots C5-T1 -->
  <g font-size="11" fill="#1c2430">
    <circle cx="60" cy="90" r="16" fill="#3b5f8a"/><text x="60" y="94" text-anchor="middle" fill="#faf8f4" font-weight="700">C5</text>
    <circle cx="60" cy="140" r="16" fill="#3b5f8a"/><text x="60" y="144" text-anchor="middle" fill="#faf8f4" font-weight="700">C6</text>
    <circle cx="60" cy="190" r="16" fill="#3b5f8a"/><text x="60" y="194" text-anchor="middle" fill="#faf8f4" font-weight="700">C7</text>
    <circle cx="60" cy="240" r="16" fill="#3b5f8a"/><text x="60" y="244" text-anchor="middle" fill="#faf8f4" font-weight="700">C8</text>
    <circle cx="60" cy="290" r="16" fill="#3b5f8a"/><text x="60" y="294" text-anchor="middle" fill="#faf8f4" font-weight="700">T1</text>
  </g>

  <!-- Trunks -->
  <g font-size="10" fill="#1c2430">
    <rect x="145" y="100" width="80" height="26" rx="5" fill="#c9a25a"/>
    <text x="185" y="118" text-anchor="middle" font-weight="700">Upper</text>
    <rect x="145" y="177" width="80" height="26" rx="5" fill="#c9a25a"/>
    <text x="185" y="195" text-anchor="middle" font-weight="700">Middle</text>
    <rect x="145" y="252" width="80" height="26" rx="5" fill="#c9a25a"/>
    <text x="185" y="270" text-anchor="middle" font-weight="700">Lower</text>
  </g>
  <path d="M76 90 L145 108" stroke="#5b6472" fill="none"/>
  <path d="M76 140 L145 116" stroke="#5b6472" fill="none"/>
  <path d="M76 190 L145 190" stroke="#5b6472" fill="none"/>
  <path d="M76 240 L145 262" stroke="#5b6472" fill="none"/>
  <path d="M76 290 L145 268" stroke="#5b6472" fill="none"/>

  <!-- Erb's palsy marker at upper trunk (C5-C6) -->
  <circle cx="185" cy="90" r="5" fill="#b5472a"/>
  <text x="196" y="80" font-size="8.5" fill="#b5472a" font-weight="700">Erb's palsy (C5-C6)</text>
  <text x="196" y="92" font-size="7.5" fill="#5b6472">"waiter's tip", traction birth injury</text>

  <!-- Klumpke's palsy marker at lower trunk (C8-T1) -->
  <circle cx="185" cy="290" r="5" fill="#b5472a"/>
  <text x="196" y="300" font-size="8.5" fill="#b5472a" font-weight="700">Klumpke's palsy (C8-T1)</text>
  <text x="196" y="312" font-size="7.5" fill="#5b6472">claw hand, upward traction of arm</text>

  <!-- Divisions (anterior/posterior) small marks -->
  <g font-size="9" fill="#5b6472">
    <line x1="225" y1="113" x2="270" y2="100" stroke="#5b6472"/>
    <line x1="225" y1="113" x2="270" y2="140" stroke="#5b6472" stroke-dasharray="3 2"/>
    <line x1="225" y1="190" x2="270" y2="180" stroke="#5b6472"/>
    <line x1="225" y1="190" x2="270" y2="215" stroke="#5b6472" stroke-dasharray="3 2"/>
    <line x1="225" y1="265" x2="270" y2="250" stroke="#5b6472"/>
    <line x1="225" y1="265" x2="270" y2="285" stroke="#5b6472" stroke-dasharray="3 2"/>
    <text x="272" y="450">&#8212; solid = anterior division</text>
    <text x="272" y="465">- - - = posterior division</text>
  </g>

  <!-- Cords -->
  <g font-size="10" fill="#faf8f4">
    <rect x="360" y="95" width="110" height="26" rx="5" fill="#2f7d4f"/>
    <text x="415" y="113" text-anchor="middle" font-weight="700">Lateral cord</text>
    <rect x="360" y="177" width="110" height="26" rx="5" fill="#b5472a"/>
    <text x="415" y="195" text-anchor="middle" font-weight="700">Posterior cord</text>
    <rect x="360" y="255" width="110" height="26" rx="5" fill="#3b5f8a"/>
    <text x="415" y="273" text-anchor="middle" font-weight="700">Medial cord</text>
  </g>
  <path d="M270 100 L360 108" stroke="#5b6472" fill="none"/>
  <path d="M270 180 L360 108" stroke="#5b6472" fill="none"/>
  <path d="M270 140 L360 190" stroke="#5b6472" stroke-dasharray="3 2" fill="none"/>
  <path d="M270 215 L360 190" stroke="#5b6472" stroke-dasharray="3 2" fill="none"/>
  <path d="M270 250 L360 190" stroke="#5b6472" fill="none"/>
  <path d="M270 285 L360 267" stroke="#5b6472" fill="none"/>

  <!-- Branches -->
  <g font-size="9.5" fill="#1c2430">
    <text x="490" y="90" font-weight="700">Musculocutaneous</text><text x="700" y="90" fill="#5b6472">(biceps, elbow flexion)</text>
    <text x="490" y="115" font-weight="700">Axillary</text><text x="700" y="115" fill="#5b6472">(deltoid, teres minor)</text>
    <text x="490" y="140" font-weight="700">Radial</text><text x="700" y="140" fill="#5b6472">(triceps, wrist ext. &#8212; wrist drop)</text>
    <text x="490" y="165" font-weight="700">Median</text><text x="700" y="165" fill="#5b6472">(forearm flexors, LOAF)</text>
    <text x="490" y="190" font-weight="700">Ulnar</text><text x="700" y="190" fill="#5b6472">(claw hand, intrinsics)</text>
    <text x="490" y="215" font-weight="700">Musculocutaneous, Median</text><text x="700" y="215" fill="#5b6472">(from lat+med)</text>
  </g>
  <path d="M470 108 L490 84" stroke="#5b6472" fill="none"/>
  <path d="M470 195 L490 108" stroke="#5b6472" fill="none"/>
  <path d="M470 195 L490 134" stroke="#5b6472" fill="none"/>
  <path d="M470 108 L490 159" stroke="#5b6472" fill="none"/>
  <path d="M470 267 L490 184" stroke="#5b6472" fill="none"/>

  <!-- footnote -->
  <rect x="30" y="380" width="740" height="95" fill="#ffffff" stroke="#c9a25a" stroke-width="1.2" rx="8"/>
  <text x="45" y="400" font-size="11" font-weight="700" fill="#1c2430">Mnemonic: "Randy Travis Drinks Cold Beer" (Roots, Trunks, Divisions, Cords, Branches)</text>
  <text x="45" y="418" font-size="9.5" fill="#5b6472">Median nerve = lateral cord (C6/C7 fibers, motor to lateral forearm) + medial cord (C8/T1 fibers, motor/sensory to hand) contributions join distally.</text>
  <text x="45" y="435" font-size="9.5" fill="#5b6472">Posterior cord gives axillary + radial &#8212; injury (e.g., mid-shaft humerus fracture &#8594; radial n.) causes wrist drop.</text>
  <text x="45" y="452" font-size="9.5" fill="#5b6472">Long thoracic nerve (C5-C7, off roots directly) &#8594; serratus anterior &#8212; injury causes winged scapula, not shown as a terminal branch.</text>
</svg>
