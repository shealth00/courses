<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="800" height="500" fill="#faf8f4"/>
  <text x="400" y="24" text-anchor="middle" font-size="19" font-weight="700" fill="#1c2430">Lumbosacral Plexus</text>
  <text x="400" y="43" text-anchor="middle" font-size="12" fill="#5b6472">Root origins of the femoral, obturator, and sciatic nerves</text>

  <!-- roots column -->
  <g font-size="11" fill="#faf8f4" text-anchor="middle">
    <circle cx="70" cy="90" r="16" fill="#3b5f8a"/><text x="70" y="94" font-weight="700">L2</text>
    <circle cx="70" cy="135" r="16" fill="#3b5f8a"/><text x="70" y="139" font-weight="700">L3</text>
    <circle cx="70" cy="180" r="16" fill="#3b5f8a"/><text x="70" y="184" font-weight="700">L4</text>
    <circle cx="70" cy="225" r="16" fill="#3b5f8a"/><text x="70" y="229" font-weight="700">L5</text>
    <circle cx="70" cy="270" r="16" fill="#3b5f8a"/><text x="70" y="274" font-weight="700">S1</text>
    <circle cx="70" cy="315" r="16" fill="#3b5f8a"/><text x="70" y="319" font-weight="700">S2</text>
    <circle cx="70" cy="360" r="16" fill="#3b5f8a"/><text x="70" y="364" font-weight="700">S3</text>
  </g>
  <text x="70" y="65" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5b6472">Roots</text>

  <!-- Lumbar plexus box (L2-L4) -->
  <rect x="150" y="70" width="170" height="150" rx="8" fill="none" stroke="#c9a25a" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="235" y="60" text-anchor="middle" font-size="10.5" font-weight="700" fill="#946a2b">Lumbar plexus (L1-L4)</text>

  <!-- Sacral plexus box (L4-S4) -->
  <rect x="150" y="200" width="170" height="200" rx="8" fill="none" stroke="#b5472a" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="235" y="415" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b5472a">Sacral plexus (L4-S4)</text>

  <line x1="86" y1="90" x2="150" y2="115" stroke="#5b6472"/>
  <line x1="86" y1="135" x2="150" y2="135" stroke="#5b6472"/>
  <line x1="86" y1="180" x2="150" y2="155" stroke="#5b6472"/>
  <line x1="86" y1="180" x2="150" y2="280" stroke="#5b6472"/>
  <line x1="86" y1="225" x2="150" y2="300" stroke="#5b6472"/>
  <line x1="86" y1="270" x2="150" y2="320" stroke="#5b6472"/>
  <line x1="86" y1="315" x2="150" y2="340" stroke="#5b6472"/>
  <line x1="86" y1="360" x2="150" y2="380" stroke="#5b6472"/>

  <!-- Femoral nerve -->
  <rect x="360" y="90" width="130" height="60" rx="7" fill="#2f7d4f"/>
  <text x="425" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#faf8f4">Femoral n.</text>
  <text x="425" y="126" text-anchor="middle" font-size="8.5" fill="#faf8f4">(L2-L4, post. division)</text>
  <text x="425" y="138" text-anchor="middle" font-size="8" fill="#faf8f4">quadriceps, knee ext.,</text>
  <text x="425" y="148" text-anchor="middle" font-size="8" fill="#faf8f4">anterior thigh/medial leg sens.</text>
  <line x1="320" y1="120" x2="360" y2="120" stroke="#5b6472" stroke-width="2"/>

  <!-- Obturator nerve -->
  <rect x="360" y="165" width="130" height="55" rx="7" fill="#c9a25a"/>
  <text x="425" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#1c2430">Obturator n.</text>
  <text x="425" y="200" text-anchor="middle" font-size="8.5" fill="#1c2430">(L2-L4, ant. division)</text>
  <text x="425" y="212" text-anchor="middle" font-size="8" fill="#1c2430">medial thigh adduction</text>
  <line x1="320" y1="190" x2="360" y2="190" stroke="#5b6472" stroke-width="2"/>

  <!-- Sciatic nerve -->
  <rect x="360" y="255" width="150" height="90" rx="7" fill="#b5472a"/>
  <text x="435" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#faf8f4">Sciatic n. (L4-S3)</text>
  <text x="435" y="292" text-anchor="middle" font-size="8.5" fill="#faf8f4">tibial + common fibular divisions</text>
  <text x="435" y="305" text-anchor="middle" font-size="8" fill="#faf8f4">hamstrings, all muscles</text>
  <text x="435" y="316" text-anchor="middle" font-size="8" fill="#faf8f4">below the knee</text>
  <text x="435" y="330" text-anchor="middle" font-size="8" fill="#faf8f4">exits via greater sciatic foramen</text>
  <line x1="320" y1="300" x2="360" y2="300" stroke="#5b6472" stroke-width="2"/>

  <!-- Sciatic branches -->
  <rect x="560" y="240" width="180" height="42" rx="6" fill="#3b5f8a"/>
  <text x="650" y="257" text-anchor="middle" font-size="10" font-weight="700" fill="#faf8f4">Tibial n.</text>
  <text x="650" y="270" text-anchor="middle" font-size="8" fill="#faf8f4">posterior leg, plantar foot</text>
  <line x1="510" y1="280" x2="560" y2="261" stroke="#5b6472"/>

  <rect x="560" y="295" width="180" height="55" rx="6" fill="#946a2b"/>
  <text x="650" y="313" text-anchor="middle" font-size="10" font-weight="700" fill="#faf8f4">Common fibular (peroneal) n.</text>
  <text x="650" y="327" text-anchor="middle" font-size="8" fill="#faf8f4">anterolateral leg, dorsiflexion</text>
  <text x="650" y="339" text-anchor="middle" font-size="8" fill="#faf8f4">vulnerable at fibular neck &#8594; foot drop</text>
  <line x1="510" y1="320" x2="560" y2="322" stroke="#5b6472"/>

  <!-- Other sacral plexus branches -->
  <rect x="360" y="360" width="360" height="34" rx="6" fill="#3b5f8a"/>
  <text x="540" y="381" text-anchor="middle" font-size="9.5" font-weight="700" fill="#faf8f4">Superior/inferior gluteal, pudendal, post. femoral cutaneous n.</text>
  <line x1="320" y1="380" x2="360" y2="377" stroke="#5b6472"/>

  <!-- footnote -->
  <rect x="30" y="420" width="740" height="60" fill="#ffffff" stroke="#c9a25a" stroke-width="1.2" rx="8"/>
  <text x="45" y="438" font-size="9.5" fill="#5b6472">L4 contributes to both the lumbar (femoral/obturator) and sacral (sciatic) plexuses &#8212; the "furcal nerve."</text>
  <text x="45" y="455" font-size="9.5" fill="#5b6472">Hip dislocation classically injures the sciatic nerve; fibular neck fracture/compression injures the common fibular nerve &#8594; foot drop.</text>
  <text x="45" y="470" font-size="9.5" fill="#5b6472">Femoral nerve is at risk in pelvic/retroperitoneal surgery and femoral hernia repair; obturator in obturator hernia and pelvic surgery.</text>
</svg>
