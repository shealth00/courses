<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="800" height="500" fill="#faf8f4"/>
  <text x="400" y="26" text-anchor="middle" font-size="20" font-weight="700" fill="#1c2430">Wound Healing: The Four Phases</text>
  <text x="400" y="45" text-anchor="middle" font-size="12.5" fill="#5b6472">Hemostasis &#8594; Inflammation &#8594; Proliferation &#8594; Remodeling</text>

  <!-- 4 panels -->
  <g>
    <!-- Panel 1: Hemostasis -->
    <rect x="30" y="70" width="175" height="330" rx="8" fill="#ffffff" stroke="#b5472a" stroke-width="1.5"/>
    <rect x="30" y="70" width="175" height="30" rx="8" fill="#b5472a"/>
    <text x="117" y="90" text-anchor="middle" font-size="11.5" font-weight="700" fill="#faf8f4">1. Hemostasis</text>
    <text x="117" y="112" text-anchor="middle" font-size="9" fill="#5b6472">minutes</text>
    <!-- icon: platelet plug -->
    <circle cx="117" cy="150" r="10" fill="#c9a25a"/>
    <circle cx="105" cy="160" r="7" fill="#c9a25a"/>
    <circle cx="130" cy="160" r="7" fill="#c9a25a"/>
    <circle cx="117" cy="168" r="7" fill="#c9a25a"/>
    <path d="M90 150 L145 150" stroke="#b5472a" stroke-width="3" stroke-dasharray="3 3"/>
    <text x="45" y="200" font-size="9" fill="#1c2430">&#8226; Vasoconstriction</text>
    <text x="45" y="216" font-size="9" fill="#1c2430">&#8226; Platelet plug (GPIb/GPIIb-IIIa)</text>
    <text x="45" y="232" font-size="9" fill="#1c2430">&#8226; Coagulation cascade &#8594; fibrin</text>
    <text x="45" y="248" font-size="9" fill="#1c2430">&#8226; Clot stabilizes wound edges</text>
  </g>

  <g>
    <!-- Panel 2: Inflammation -->
    <rect x="215" y="70" width="175" height="330" rx="8" fill="#ffffff" stroke="#c9a25a" stroke-width="1.5"/>
    <rect x="215" y="70" width="175" height="30" rx="8" fill="#c9a25a"/>
    <text x="302" y="90" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2430">2. Inflammation</text>
    <text x="302" y="112" text-anchor="middle" font-size="9" fill="#5b6472">days 1&#8211;5</text>
    <!-- icon: neutrophils -->
    <circle cx="280" cy="155" r="9" fill="#946a2b"/>
    <circle cx="305" cy="150" r="9" fill="#946a2b"/>
    <circle cx="325" cy="162" r="9" fill="#3b5f8a"/>
    <text x="230" y="200" font-size="9" fill="#1c2430">&#8226; Neutrophils first (24-48h)</text>
    <text x="230" y="216" font-size="9" fill="#1c2430">&#8226; &#8594; Macrophages (day 2-3) clear</text>
    <text x="230" y="230" font-size="9" fill="#1c2430">&#160;&#160;debris, release growth factors</text>
    <text x="230" y="246" font-size="9" fill="#1c2430">&#8226; Cardinal signs: rubor, calor,</text>
    <text x="230" y="260" font-size="9" fill="#1c2430">&#160;&#160;tumor, dolor, functio laesa</text>
  </g>

  <g>
    <!-- Panel 3: Proliferation -->
    <rect x="400" y="70" width="185" height="330" rx="8" fill="#ffffff" stroke="#2f7d4f" stroke-width="1.5"/>
    <rect x="400" y="70" width="185" height="30" rx="8" fill="#2f7d4f"/>
    <text x="492" y="90" text-anchor="middle" font-size="11.5" font-weight="700" fill="#faf8f4">3. Proliferation</text>
    <text x="492" y="112" text-anchor="middle" font-size="9" fill="#5b6472">days 3&#8211;21</text>
    <!-- icon: granulation/vessels -->
    <path d="M440 145 q15 -20 30 0 t30 0 t30 0" stroke="#b5472a" stroke-width="2.5" fill="none"/>
    <circle cx="530" cy="150" r="6" fill="#2f7d4f"/>
    <text x="415" y="200" font-size="9" fill="#1c2430">&#8226; Fibroblasts &#8594; type III collagen</text>
    <text x="415" y="216" font-size="9" fill="#1c2430">&#8226; Angiogenesis (granulation tissue)</text>
    <text x="415" y="230" font-size="9" fill="#1c2430">&#8226; Re-epithelialization from edges</text>
    <text x="415" y="246" font-size="9" fill="#1c2430">&#8226; Myofibroblasts &#8594; wound contraction</text>
    <text x="415" y="260" font-size="9" fill="#1c2430">&#8226; VEGF, PDGF, TGF-&#946; drive this phase</text>
  </g>

  <g>
    <!-- Panel 4: Remodeling -->
    <rect x="595" y="70" width="175" height="330" rx="8" fill="#ffffff" stroke="#3b5f8a" stroke-width="1.5"/>
    <rect x="595" y="70" width="175" height="30" rx="8" fill="#3b5f8a"/>
    <text x="682" y="90" text-anchor="middle" font-size="11.5" font-weight="700" fill="#faf8f4">4. Remodeling</text>
    <text x="682" y="112" text-anchor="middle" font-size="9" fill="#5b6472">weeks &#8211; 1+ year</text>
    <!-- icon: collagen fibers realigning -->
    <line x1="630" y1="140" x2="735" y2="140" stroke="#3b5f8a" stroke-width="3"/>
    <line x1="630" y1="150" x2="735" y2="150" stroke="#3b5f8a" stroke-width="3"/>
    <line x1="630" y1="160" x2="735" y2="160" stroke="#3b5f8a" stroke-width="3"/>
    <text x="610" y="200" font-size="9" fill="#1c2430">&#8226; Type III collagen &#8594; type I</text>
    <text x="610" y="216" font-size="9" fill="#1c2430">&#8226; Collagen cross-linking &amp; realign</text>
    <text x="610" y="230" font-size="9" fill="#1c2430">&#160;&#160;along tension lines &#8594; &#8593; tensile</text>
    <text x="610" y="244" font-size="9" fill="#1c2430">&#160;&#160;strength (max ~80% of normal)</text>
    <text x="610" y="260" font-size="9" fill="#1c2430">&#8226; Vascular regression, scar pales</text>
  </g>

  <!-- horizontal arrow flow at bottom of panels -->
  <g stroke="#1c2430" stroke-width="2" fill="#1c2430">
    <path d="M205 280 l14 0 l-4 -5 m4 5 l-4 5" fill="none"/>
    <path d="M390 280 l14 0 l-4 -5 m4 5 l-4 5" fill="none"/>
    <path d="M585 280 l14 0 l-4 -5 m4 5 l-4 5" fill="none"/>
  </g>

  <!-- clinical notes box -->
  <rect x="30" y="415" width="740" height="70" fill="#ffffff" stroke="#c9a25a" stroke-width="1.2" rx="8"/>
  <text x="45" y="433" font-size="10.5" font-weight="700" fill="#1c2430">High-yield associations</text>
  <text x="45" y="450" font-size="9.5" fill="#5b6472">Vitamin C deficiency &#8594; defective collagen hydroxylation &#8594; poor wound healing. Zinc deficiency also impairs healing (cofactor for collagenase).</text>
  <text x="45" y="467" font-size="9.5" fill="#5b6472">Keloid = collagen overproduction beyond wound margins; hypertrophic scar stays within margins. Both reflect excess/disordered remodeling.</text>
</svg>
