<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="1000" height="800" fill="#faf8f4"/>
  <text x="500" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#1c2430">Immunology &#8212; Big Picture</text>
  <text x="500" y="49" text-anchor="middle" font-size="12" fill="#5b6472">Four major presentation clusters, branching to the conditions within each &#8212; start here</text>

  <!-- ============================== CONNECTORS ============================== -->
  <g stroke="#3b5f8a" stroke-width="2.2" fill="none">
    <line x1="500" y1="400" x2="373" y2="273"/>
  </g>
  <g stroke="#b5472a" stroke-width="2.2" fill="none">
    <line x1="500" y1="400" x2="627" y2="273"/>
  </g>
  <g stroke="#c9a25a" stroke-width="2.2" fill="none">
    <line x1="500" y1="400" x2="627" y2="527"/>
  </g>
  <g stroke="#5b6472" stroke-width="2.2" fill="none">
    <line x1="500" y1="400" x2="373" y2="527"/>
  </g>

  <!-- Recurrent Infections branch -> leaves -->
  <g stroke="#3b5f8a" stroke-width="1.3" opacity="0.7" fill="none">
    <line x1="373" y1="273" x2="421" y2="28"/>
    <line x1="373" y1="273" x2="287" y2="85"/>
    <line x1="373" y1="273" x2="185" y2="187"/>
    <line x1="373" y1="273" x2="128" y2="321"/>
  </g>
  <!-- Autoimmune branch -> leaves -->
  <g stroke="#b5472a" stroke-width="1.3" opacity="0.7" fill="none">
    <line x1="627" y1="273" x2="872" y2="321"/>
    <line x1="627" y1="273" x2="815" y2="187"/>
    <line x1="627" y1="273" x2="713" y2="85"/>
    <line x1="627" y1="273" x2="579" y2="28"/>
  </g>
  <!-- Hypersensitivity branch -> leaves -->
  <g stroke="#c9a25a" stroke-width="1.3" opacity="0.7" fill="none">
    <line x1="627" y1="527" x2="579" y2="772"/>
    <line x1="627" y1="527" x2="713" y2="715"/>
    <line x1="627" y1="527" x2="815" y2="613"/>
    <line x1="627" y1="527" x2="872" y2="479"/>
  </g>
  <!-- Transplant & Transfusion branch -> leaves -->
  <g stroke="#5b6472" stroke-width="1.3" opacity="0.7" fill="none">
    <line x1="373" y1="527" x2="128" y2="479"/>
    <line x1="373" y1="527" x2="185" y2="613"/>
    <line x1="373" y1="527" x2="287" y2="715"/>
    <line x1="373" y1="527" x2="421" y2="772"/>
  </g>

  <!-- ============================== CENTER HUB ============================== -->
  <circle cx="500" cy="400" r="64" fill="#1c2430" stroke="#1c2430" stroke-width="2"/>
  <circle cx="500" cy="400" r="58" fill="none" stroke="#faf8f4" stroke-width="1.5" opacity="0.5"/>
  <text x="500" y="406" text-anchor="middle" font-size="18" font-weight="700" fill="#faf8f4">Immunology</text>

  <!-- ============================== BRANCH NODES ============================== -->
  <!-- Recurrent Infections (up-left) -->
  <rect x="278" y="248" width="190" height="50" rx="10" fill="#3b5f8a"/>
  <text x="373" y="269" text-anchor="middle" font-size="12.5" font-weight="700" fill="#faf8f4">Recurrent</text>
  <text x="373" y="285" text-anchor="middle" font-size="12.5" font-weight="700" fill="#faf8f4">Infections</text>

  <!-- Autoimmune / Immune-Complex (up-right) -->
  <rect x="532" y="248" width="190" height="50" rx="10" fill="#b5472a"/>
  <text x="627" y="269" text-anchor="middle" font-size="12.5" font-weight="700" fill="#faf8f4">Autoimmune /</text>
  <text x="627" y="285" text-anchor="middle" font-size="12.5" font-weight="700" fill="#faf8f4">Immune-Complex Dz</text>

  <!-- Hypersensitivity (down-right) -->
  <rect x="532" y="502" width="190" height="50" rx="10" fill="#c9a25a"/>
  <text x="627" y="523" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c2430">Hypersensitivity</text>
  <text x="627" y="539" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c2430">Reactions</text>

  <!-- Transplant & Transfusion (down-left) -->
  <rect x="278" y="502" width="190" height="50" rx="10" fill="#5b6472"/>
  <text x="373" y="523" text-anchor="middle" font-size="12.5" font-weight="700" fill="#faf8f4">Transplant &amp;</text>
  <text x="373" y="539" text-anchor="middle" font-size="12.5" font-weight="700" fill="#faf8f4">Transfusion Rxns</text>

  <!-- ============================== LEAVES: Recurrent Infections ============================== -->
  <g>
    <rect x="329" y="-1" width="184" height="58" rx="8" fill="#ffffff" stroke="#3b5f8a" stroke-width="1.4"/>
    <text x="421" y="19" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3b5f8a">T/B-Combined</text>
    <text x="421" y="36" text-anchor="middle" font-size="9.5" fill="#1c2430">SCID, DiGeorge syndrome</text>
  </g>
  <g>
    <rect x="195" y="56" width="184" height="58" rx="8" fill="#ffffff" stroke="#3b5f8a" stroke-width="1.4"/>
    <text x="287" y="76" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3b5f8a">B-Cell Defects</text>
    <text x="287" y="93" text-anchor="middle" font-size="9.5" fill="#1c2430">XLA, CVID, Hyper-IgM,</text>
    <text x="287" y="106" text-anchor="middle" font-size="9.5" fill="#1c2430">IgA deficiency</text>
  </g>
  <g>
    <rect x="93" y="158" width="184" height="58" rx="8" fill="#ffffff" stroke="#3b5f8a" stroke-width="1.4"/>
    <text x="185" y="178" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3b5f8a">Phagocyte Defects</text>
    <text x="185" y="195" text-anchor="middle" font-size="9.5" fill="#1c2430">CGD, LAD,</text>
    <text x="185" y="208" text-anchor="middle" font-size="9.5" fill="#1c2430">Chediak-Higashi syndrome</text>
  </g>
  <g>
    <rect x="36" y="292" width="184" height="58" rx="8" fill="#ffffff" stroke="#3b5f8a" stroke-width="1.4"/>
    <text x="128" y="312" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3b5f8a">Complement Defects</text>
    <text x="128" y="329" text-anchor="middle" font-size="9.5" fill="#1c2430">C5-9 def. &#8594; Neisseria</text>
    <text x="128" y="342" text-anchor="middle" font-size="9.5" fill="#1c2430">C1-INH def. &#8594; angioedema</text>
  </g>

  <!-- ============================== LEAVES: Autoimmune / Immune-Complex ============================== -->
  <g>
    <rect x="780" y="292" width="184" height="58" rx="8" fill="#ffffff" stroke="#b5472a" stroke-width="1.4"/>
    <text x="872" y="312" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b5472a">Immune-Complex (III)</text>
    <text x="872" y="329" text-anchor="middle" font-size="9.5" fill="#1c2430">SLE, serum sickness</text>
  </g>
  <g>
    <rect x="723" y="158" width="184" height="58" rx="8" fill="#ffffff" stroke="#b5472a" stroke-width="1.4"/>
    <text x="815" y="178" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b5472a">Cytotoxic (II)</text>
    <text x="815" y="195" text-anchor="middle" font-size="9.5" fill="#1c2430">Goodpasture syndrome</text>
  </g>
  <g>
    <rect x="621" y="56" width="184" height="58" rx="8" fill="#ffffff" stroke="#b5472a" stroke-width="1.4"/>
    <text x="713" y="76" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b5472a">Organ-Specific</text>
    <text x="713" y="93" text-anchor="middle" font-size="9.5" fill="#1c2430">Graves, Hashimoto, T1DM</text>
  </g>
  <g>
    <rect x="487" y="-1" width="184" height="58" rx="8" fill="#ffffff" stroke="#b5472a" stroke-width="1.4"/>
    <text x="579" y="19" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b5472a">Rheumatoid Arthritis</text>
    <text x="579" y="36" text-anchor="middle" font-size="9.5" fill="#1c2430">Immune complex +</text>
    <text x="579" y="49" text-anchor="middle" font-size="9.5" fill="#1c2430">cell-mediated injury</text>
  </g>

  <!-- ============================== LEAVES: Hypersensitivity ============================== -->
  <g>
    <rect x="487" y="743" width="184" height="58" rx="8" fill="#ffffff" stroke="#946a2b" stroke-width="1.4"/>
    <text x="579" y="763" text-anchor="middle" font-size="11.5" font-weight="700" fill="#946a2b">Type I &#8212; Immediate</text>
    <text x="579" y="780" text-anchor="middle" font-size="9.5" fill="#1c2430">IgE/mast cell:</text>
    <text x="579" y="793" text-anchor="middle" font-size="9.5" fill="#1c2430">anaphylaxis, atopy</text>
  </g>
  <g>
    <rect x="621" y="686" width="184" height="58" rx="8" fill="#ffffff" stroke="#946a2b" stroke-width="1.4"/>
    <text x="713" y="706" text-anchor="middle" font-size="11.5" font-weight="700" fill="#946a2b">Type II &#8212; Cytotoxic</text>
    <text x="713" y="723" text-anchor="middle" font-size="9.5" fill="#1c2430">Antibody-mediated:</text>
    <text x="713" y="736" text-anchor="middle" font-size="9.5" fill="#1c2430">AHTR</text>
  </g>
  <g>
    <rect x="723" y="584" width="184" height="58" rx="8" fill="#ffffff" stroke="#946a2b" stroke-width="1.4"/>
    <text x="815" y="604" text-anchor="middle" font-size="11.5" font-weight="700" fill="#946a2b">Type III &#8212; Immune Cx</text>
    <text x="815" y="621" text-anchor="middle" font-size="9.5" fill="#1c2430">SLE, serum sickness</text>
  </g>
  <g>
    <rect x="780" y="450" width="184" height="58" rx="8" fill="#ffffff" stroke="#946a2b" stroke-width="1.4"/>
    <text x="872" y="470" text-anchor="middle" font-size="11.5" font-weight="700" fill="#946a2b">Type IV &#8212; Delayed</text>
    <text x="872" y="487" text-anchor="middle" font-size="9.5" fill="#1c2430">T-cell mediated:</text>
    <text x="872" y="500" text-anchor="middle" font-size="9.5" fill="#1c2430">PPD, contact dermatitis</text>
  </g>

  <!-- ============================== LEAVES: Transplant & Transfusion ============================== -->
  <g>
    <rect x="36" y="450" width="184" height="58" rx="8" fill="#ffffff" stroke="#5b6472" stroke-width="1.4"/>
    <text x="128" y="470" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5b6472">Hyperacute Rejection</text>
    <text x="128" y="487" text-anchor="middle" font-size="9.5" fill="#1c2430">Preformed antibody,</text>
    <text x="128" y="500" text-anchor="middle" font-size="9.5" fill="#1c2430">within minutes</text>
  </g>
  <g>
    <rect x="93" y="584" width="184" height="58" rx="8" fill="#ffffff" stroke="#5b6472" stroke-width="1.4"/>
    <text x="185" y="604" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5b6472">Acute / Chronic</text>
    <text x="185" y="621" text-anchor="middle" font-size="9.5" fill="#1c2430">T-cell mediated /</text>
    <text x="185" y="634" text-anchor="middle" font-size="9.5" fill="#1c2430">vascular fibrosis</text>
  </g>
  <g>
    <rect x="195" y="686" width="184" height="58" rx="8" fill="#ffffff" stroke="#5b6472" stroke-width="1.4"/>
    <text x="287" y="706" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5b6472">GVHD</text>
    <text x="287" y="723" text-anchor="middle" font-size="9.5" fill="#1c2430">Donor T cells attack</text>
    <text x="287" y="736" text-anchor="middle" font-size="9.5" fill="#1c2430">host tissue</text>
  </g>
  <g>
    <rect x="329" y="743" width="184" height="58" rx="8" fill="#ffffff" stroke="#5b6472" stroke-width="1.4"/>
    <text x="421" y="763" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5b6472">Transfusion Rxns</text>
    <text x="421" y="780" text-anchor="middle" font-size="9.5" fill="#1c2430">AHTR, TRALI,</text>
    <text x="421" y="793" text-anchor="middle" font-size="9.5" fill="#1c2430">anaphylactic (anti-IgA)</text>
  </g>
</svg>
